<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><rect width="1400" height="600" fill="#fafaf9"/><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ededeb"/><line x1="0" y1="0" x2="0" y2="6" stroke="#0a0a0a" stroke-width="2"/></pattern></defs><text x="48" y="58" font-size="13" fill="#737373" font-weight="500" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.08em">ANATOMY OF A SHIELDED TRANSACTION</text><text x="48" y="96" font-size="28" fill="#0a0a0a" font-weight="700" text-anchor="start" letter-spacing="-0.01em">A 441-byte body in the block, a proof up to 192 KiB beside it</text><line x1="48" y1="120" x2="1352" y2="120" stroke="#e8e8e6"/><rect x="48.0" y="170" width="91.9" height="86" rx="5" fill="#ffffff" stroke="#e8e8e6"/><text x="58" y="204" font-size="13.5" fill="#0a0a0a" font-weight="600" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">version</text><text x="58" y="232" font-size="12.5" fill="#737373" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">u8 · u8</text><rect x="143.9" y="170" width="139.8" height="86" rx="5" fill="#ffffff" stroke="#e8e8e6"/><text x="153.88235294117646" y="204" font-size="13.5" fill="#0a0a0a" font-weight="600" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">anchor</text><text x="153.88235294117646" y="232" font-size="12.5" fill="#737373" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">48 B</text><rect x="287.7" y="170" width="178.2" height="86" rx="5" fill="#ffffff" stroke="#e8e8e6"/><text x="297.70588235294116" y="204" font-size="13.5" fill="#0a0a0a" font-weight="600" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">nf ×2</text><text x="297.70588235294116" y="232" font-size="12.5" fill="#737373" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">2 × 48 B</text><rect x="469.9" y="170" width="178.2" height="86" rx="5" fill="#ffffff" stroke="#e8e8e6"/><text x="479.88235294117646" y="204" font-size="13.5" fill="#0a0a0a" font-weight="600" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">cm_out ×2</text><text x="479.88235294117646" y="232" font-size="12.5" fill="#737373" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">2 × 48 B</text><rect x="652.1" y="170" width="187.8" height="86" rx="5" fill="#ffffff" stroke="#e8e8e6"/><text x="662.0588235294117" y="204" font-size="13.5" fill="#0a0a0a" font-weight="600" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">recovery</text><text x="662.0588235294117" y="232" font-size="12.5" fill="#737373" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">32+64+16 B</text><rect x="843.8" y="170" width="245.3" height="86" rx="5" fill="#ffffff" stroke="#e8e8e6"/><text x="853.8235294117646" y="204" font-size="13.5" fill="#0a0a0a" font-weight="600" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">v_in · v_out · dest</text><text x="853.8235294117646" y="232" font-size="12.5" fill="#737373" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">u64 · u64 · opt</text><rect x="1093.1" y="170" width="91.9" height="86" rx="5" fill="#ffffff" stroke="#e8e8e6"/><text x="1103.1176470588234" y="204" font-size="13.5" fill="#0a0a0a" font-weight="600" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">fee</text><text x="1103.1176470588234" y="232" font-size="12.5" fill="#737373" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">u64</text><rect x="1189.0" y="170" width="159.0" height="86" rx="5" fill="#f0e9fd" stroke="#6c24e0"/><text x="1199.0" y="204" font-size="13.5" fill="#0a0a0a" font-weight="600" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">proof_hash</text><text x="1199.0" y="232" font-size="12.5" fill="#737373" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">64 B</text><text x="48" y="290" font-size="12.5" fill="#737373" font-weight="500" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.04em">BODY · in the block's shielded section · committed by transactions_root</text><rect x="832" y="350" width="520" height="150" rx="8" fill="#ffffff" stroke="#6c24e0" stroke-width="1.5"/><text x="854" y="384" font-size="17" fill="#0a0a0a" font-weight="600" text-anchor="start">Witness sidecar · STARK proof</text><text x="854" y="414" font-size="13.5" fill="#737373" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">PS-1: KoalaBear⁸ · FRI · Keccak-256</text><text x="854" y="440" font-size="13.5" fill="#737373" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">≈185–189 KB measured · cap 192 KiB</text><text x="854" y="466" font-size="13.5" fill="#737373" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">sent on the wire, never stored in the block DB</text><path d="M1232 258 L1232 346" stroke="#6c24e0" stroke-width="1.6" stroke-dasharray="5 5" fill="none"/><text x="1220" y="312" font-size="12.5" fill="#6c24e0" font-weight="400" text-anchor="end" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">commits to</text><rect x="48" y="350" width="560" height="150" rx="6" fill="#ffffff" stroke="#e8e8e6"/><rect x="48" y="350" width="4" height="150" rx="2" fill="#0a0a0a"/><text x="66" y="380" font-size="17" fill="#0a0a0a" font-weight="600" text-anchor="start">What an observer learns</text><text x="66" y="406" font-size="13.5" fill="#737373" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">that a valid 2×2 spend happened</text><text x="66" y="428" font-size="13.5" fill="#737373" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">public amounts in / out (shield-in, shield-out)</text><text x="66" y="450" font-size="13.5" fill="#737373" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">the constant fee — and nothing else</text><text x="48" y="556" font-size="15" fill="#1f1f1f" font-weight="400" text-anchor="start">No sender, nonce, signature or gas. Shield-in, payment and claim are indistinguishable by size and fee.</text></svg>
