<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><rect width="1400" height="640" fill="#fafaf9"/><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ededeb"/><line x1="0" y1="0" x2="0" y2="6" stroke="#0a0a0a" stroke-width="2"/></pattern></defs><text x="48" y="58" font-size="13" fill="#737373" font-weight="500" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.08em">SHIELDED SPACE · VALUE FLOW</text><text x="48" y="96" font-size="28" fill="#0a0a0a" font-weight="700" text-anchor="start" letter-spacing="-0.01em">Shield-in, pay privately, claim, shield-out — the backing always equals the notes</text><line x1="48" y1="120" x2="1352" y2="120" stroke="#e8e8e6"/><text x="48" y="168" font-size="12.5" fill="#ff6600" font-weight="600" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.06em">PUBLIC · NATIVE SPACE</text><rect x="48" y="182" width="300" height="100" rx="6" fill="#ffffff" stroke="#e8e8e6"/><rect x="48" y="182" width="4" height="100" rx="2" fill="#ff6600"/><text x="66" y="212" font-size="17" fill="#0a0a0a" font-weight="600" text-anchor="start">Your native account</text><text x="66" y="238" font-size="13.5" fill="#737373" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">signed tx, value = A</text><rect x="1052" y="182" width="300" height="100" rx="6" fill="#ffffff" stroke="#e8e8e6"/><rect x="1052" y="182" width="4" height="100" rx="2" fill="#ff6600"/><text x="1070" y="212" font-size="17" fill="#0a0a0a" font-weight="600" text-anchor="start">Any native / eSpace</text><text x="1070" y="238" font-size="13.5" fill="#737373" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">address receives v_out</text><rect x="540" y="172" width="320" height="120" rx="8" fill="#ffffff" stroke="#ff6600" stroke-width="1.5"/><text x="560" y="204" font-size="16" fill="#0a0a0a" font-weight="600" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">ShieldedBridge 0x0888…09</text><text x="560" y="232" font-size="13.5" fill="#737373" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">backing balance (native)</text><text x="560" y="258" font-size="13.5" fill="#ff6600" font-weight="600" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">= Σ value of all notes</text><text x="560" y="280" font-size="13" fill="#737373" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">fees are burned</text><defs><marker id="arr-ff6600" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6600"/></marker></defs><line x1="350" y1="232" x2="536" y2="232" stroke="#ff6600" stroke-width="1.6" marker-end="url(#arr-ff6600)"/><text x="443.0" y="224.0" font-size="12.5" fill="#737373" font-weight="400" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">shieldIn(bodyHash)</text><defs><marker id="arr-ff6600" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6600"/></marker></defs><line x1="862" y1="232" x2="1048" y2="232" stroke="#ff6600" stroke-width="1.6" marker-end="url(#arr-ff6600)"/><text x="955.0" y="224.0" font-size="12.5" fill="#737373" font-weight="400" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">v_public_out</text><rect x="48" y="352" width="1304" height="176" rx="10" fill="url(#hatch)" opacity="0.35"/><text x="48" y="340" font-size="12.5" fill="#0a0a0a" font-weight="600" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.06em">PRIVATE · SHIELDED SPACE</text><rect x="72" y="380" width="270" height="120" rx="6" fill="#ffffff" stroke="#e8e8e6"/><rect x="72" y="380" width="4" height="120" rx="2" fill="#0a0a0a"/><text x="90" y="410" font-size="17" fill="#0a0a0a" font-weight="600" text-anchor="start">1 · Shield-in</text><text x="90" y="436" font-size="13.5" fill="#737373" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">consumes deposit credit</text><text x="90" y="458" font-size="13.5" fill="#737373" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">→ self-note (seed)</text><rect x="408" y="380" width="270" height="120" rx="6" fill="#ffffff" stroke="#e8e8e6"/><rect x="408" y="380" width="4" height="120" rx="2" fill="#0a0a0a"/><text x="426" y="410" font-size="17" fill="#0a0a0a" font-weight="600" text-anchor="start">2 · Pay</text><text x="426" y="436" font-size="13.5" fill="#737373" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">2 in × 2 out, STARK</text><text x="426" y="458" font-size="13.5" fill="#737373" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">opening sent off-chain</text><rect x="744" y="380" width="270" height="120" rx="6" fill="#ffffff" stroke="#e8e8e6"/><rect x="744" y="380" width="4" height="120" rx="2" fill="#0a0a0a"/><text x="762" y="410" font-size="17" fill="#0a0a0a" font-weight="600" text-anchor="start">3 · Claim</text><text x="762" y="436" font-size="13.5" fill="#737373" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">received note + self-note</text><text x="762" y="458" font-size="13.5" fill="#737373" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">→ one recoverable note</text><rect x="1080" y="380" width="270" height="120" rx="6" fill="#ffffff" stroke="#e8e8e6"/><rect x="1080" y="380" width="4" height="120" rx="2" fill="#0a0a0a"/><text x="1098" y="410" font-size="17" fill="#0a0a0a" font-weight="600" text-anchor="start">4 · Shield-out</text><text x="1098" y="436" font-size="13.5" fill="#737373" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">v_public_out &gt; 0</text><text x="1098" y="458" font-size="13.5" fill="#737373" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">to a public address</text><defs><marker id="arr-0a0a0a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a0a0a"/></marker></defs><line x1="344" y1="440" x2="406" y2="440" stroke="#0a0a0a" stroke-width="1.6" marker-end="url(#arr-0a0a0a)"/><defs><marker id="arr-0a0a0a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a0a0a"/></marker></defs><line x1="680" y1="440" x2="742" y2="440" stroke="#0a0a0a" stroke-width="1.6" marker-end="url(#arr-0a0a0a)"/><defs><marker id="arr-0a0a0a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a0a0a"/></marker></defs><line x1="1016" y1="440" x2="1078" y2="440" stroke="#0a0a0a" stroke-width="1.6" marker-end="url(#arr-0a0a0a)"/><line x1="700" y1="294" x2="700" y2="350" stroke="#a3a3a3" stroke-dasharray="4 4"/><text x="712" y="336" font-size="12.5" fill="#737373" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">credit recorded for bodyHash</text><text x="48" y="604" font-size="15" fill="#1f1f1f" font-weight="400" text-anchor="start">Every shielded transaction has the same public shape: 2 nullifiers, 2 commitments, a recovery slot, one constant fee.</text></svg>
