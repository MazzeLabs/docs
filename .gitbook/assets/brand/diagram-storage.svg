<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><rect width="1400" height="520" fill="#fafaf9"/><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ededeb"/><line x1="0" y1="0" x2="0" y2="6" stroke="#0a0a0a" stroke-width="2"/></pattern></defs><text x="48" y="58" font-size="13" fill="#737373" font-weight="500" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.08em">STORAGE</text><text x="48" y="96" font-size="28" fill="#0a0a0a" font-weight="700" text-anchor="start" letter-spacing="-0.01em">Two tiers: MDBX for hot state, ParityDB for history and snapshots</text><line x1="48" y1="120" x2="1352" y2="120" stroke="#e8e8e6"/><rect x="48" y="160" width="620" height="220" rx="6" fill="#ffffff" stroke="#e8e8e6"/><rect x="48" y="160" width="4" height="220" rx="2" fill="#ff6600"/><text x="66" y="190" font-size="17" fill="#0a0a0a" font-weight="600" text-anchor="start">MDBX · hot tier</text><text x="66" y="216" font-size="13.5" fill="#737373" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">state_db_type = "mdbx" (default)</text><text x="66" y="238" font-size="13.5" fill="#737373" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">mmap, RAM-speed reads</text><text x="66" y="260" font-size="13.5" fill="#737373" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">current state · delta MPTs</text><text x="66" y="282" font-size="13.5" fill="#737373" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">ShieldedWitness column (pruned an era behind)</text><rect x="732" y="160" width="620" height="220" rx="6" fill="#ffffff" stroke="#e8e8e6"/><rect x="732" y="160" width="4" height="220" rx="2" fill="#0a0a0a"/><text x="750" y="190" font-size="17" fill="#0a0a0a" font-weight="600" text-anchor="start">ParityDB · cold tier</text><text x="750" y="216" font-size="13.5" fill="#737373" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">blocks · receipts · traces</text><text x="750" y="238" font-size="13.5" fill="#737373" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">history</text><text x="750" y="260" font-size="13.5" fill="#737373" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">snapshots: storage_db/snapshot/paritydb_&lt;epoch&gt;/</text><text x="750" y="282" font-size="13.5" fill="#737373" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">fallback state DB ("paritydb")</text><defs><marker id="arr-737373" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#737373"/></marker></defs><line x1="670" y1="270" x2="728" y2="270" stroke="#737373" stroke-width="1.6" marker-end="url(#arr-737373)"/><text x="48" y="430" font-size="14.5" fill="#1f1f1f" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">Checkpoint cadence  era_epoch_count = 20 000 epochs  ·  consensus says “this era is final”</text><text x="48" y="462" font-size="14.5" fill="#1f1f1f" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">Snapshot cadence    snapshot_epoch_count ≈ 2 000 epochs  ·  disk says “this state can ship to a peer”</text></svg>
